[project]
name = "traffic-flow-forecasting"
version = "1.0.0"
description = "Traffic speed forecasting on METR-LA: leak-free per-segment ML baselines, a measured gap to network-aware models, and a Streamlit results dashboard"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Manas Saxena" }]

[project.urls]
Repository = "https://github.com/ManasSaxena14/TrafficFlowControl_AIML-DL_T036"
Dashboard = "https://trafficflowamldl.streamlit.app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 135
target-version = "py311"
extend-exclude = ["ref", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip() deliberately truncates to the shorter list (e.g. a fixed colour list)

[tool.ruff.lint.per-file-ignores]
"scripts/make_report_tables.py" = ["E501"]   # long LaTeX string templates
